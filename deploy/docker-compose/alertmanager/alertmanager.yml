global:
  resolve_timeout: 30s

route:
  group_by: ['alertname', 'service', 'namespace']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'remediation-webhook'

receivers:
  - name: 'remediation-webhook'
    webhook_configs:
      - url: 'http://remediation-service:8082/api/v1/remediation/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true
