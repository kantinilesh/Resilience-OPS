global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["order-service:8080"]
        labels:
          service: "order-service"
          namespace: "resilienceops-apps"
          cluster: "local-docker-compose"

  - job_name: "inventory-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["inventory-service:8081"]
        labels:
          service: "inventory-service"
          namespace: "resilienceops-apps"
          cluster: "local-docker-compose"

  - job_name: "remediation-service"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["remediation-service:8082"]
        labels:
          service: "remediation-service"
          namespace: "resilienceops-apps"
          cluster: "local-docker-compose"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
