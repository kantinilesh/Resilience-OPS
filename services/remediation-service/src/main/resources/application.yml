server:
  port: 8082

spring:
  application:
    name: remediation-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

remediation:
  dry-run: false
  cooldown-seconds: 120
  allowed-namespaces:
    - resilienceops-apps
