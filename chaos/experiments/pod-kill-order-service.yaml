apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-order-service
  namespace: resilienceops-apps
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - resilienceops-apps
    labelSelectors:
      app.kubernetes.io/name: order-service
  scheduler:
    cron: '@every 10m'
